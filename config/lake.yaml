# Airspace and protected areas where the UAVs may not fly. Circles, APPROXIMATE and
# illustrative: real limits come from the aeronautical charts and the local authorities.
no_fly:
  - {name: "Friedrichshafen airport (EDNY), control zone", lat: 47.6713, lon: 9.5115, radius_m: 3500}
  - {name: "St. Gallen-Altenrhein airport (LSZR)", lat: 47.4850, lon: 9.5607, radius_m: 2500}
  - {name: "Eriskircher Ried nature reserve", lat: 47.6250, lon: 9.5300, radius_m: 1000}

